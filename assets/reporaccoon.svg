<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RepoRaccoon">
  <title>RepoRaccoon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2531"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b44a"/>
      <stop offset="1" stop-color="#e58a1f"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c2ce"/>
      <stop offset="1" stop-color="#8f99a7"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- folder back + tab -->
  <path d="M7 27.5a3 3 0 0 1 3-3h13l3.5 4H54a3 3 0 0 1 3 3V52H7Z" fill="#b8661a"/>

  <!-- code sheet the raccoon dug out (left) -->
  <g transform="rotate(-16 15 26)">
    <rect x="8.5" y="15.5" width="13" height="17" rx="1.8" fill="#e9eef4"/>
    <path d="M11.3 20h7.2M11.3 23.3h4.6M13.3 26.6h5.2M11.3 29.9h6" stroke="#5b95ff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ringed tail curling out on the right -->
  <path d="M49 45c7.5-1.5 10.5-8 8.3-15" fill="none" stroke="#9aa4b1" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M49 45c7.5-1.5 10.5-8 8.3-15" fill="none" stroke="#2a3039" stroke-width="7.5" stroke-dasharray="2.2 4.6" stroke-dashoffset="-4.5"/>

  <!-- raccoon: ears -->
  <path d="M17.5 21 18 9.5l9 6.5Z" fill="url(#fur)"/>
  <path d="M46.5 21 46 9.5 37 16Z" fill="url(#fur)"/>
  <path d="M19.5 17.5l.3-4.8 4 2.9Z" fill="#20252d"/>
  <path d="M44.5 17.5l-.3-4.8-4 2.9Z" fill="#20252d"/>
  <!-- head -->
  <ellipse cx="32" cy="28" rx="17" ry="14" fill="url(#fur)"/>
  <!-- white brows / cheeks -->
  <path d="M17.5 30.5c1.5-6 7-8.5 11-7.5M46.5 30.5c-1.5-6-7-8.5-11-7.5" fill="none" stroke="#eef1f5" stroke-width="2" stroke-linecap="round"/>
  <!-- bandit mask -->
  <path d="M15.5 29c2.5-4.5 8-6 12.5-3.5 2 1.1 2.8 1.6 4 1.6s2-.5 4-1.6c4.5-2.5 10-1 12.5 3.5-2.8 4.8-8.2 6-12 3.7-2.2-1.3-3.2-1.9-4.5-1.9s-2.3.6-4.5 1.9c-3.8 2.3-9.2 1.1-12-3.7Z" fill="#1c2027"/>
  <!-- eyes -->
  <circle cx="24" cy="28.4" r="2.9" fill="#fff"/>
  <circle cx="40" cy="28.4" r="2.9" fill="#fff"/>
  <circle cx="24.6" cy="28.8" r="1.6" fill="#10151c"/>
  <circle cx="40.6" cy="28.8" r="1.6" fill="#10151c"/>
  <circle cx="25.2" cy="28.1" r=".55" fill="#fff"/>
  <circle cx="41.2" cy="28.1" r=".55" fill="#fff"/>
  <!-- muzzle + nose -->
  <ellipse cx="32" cy="35.5" rx="7.5" ry="5" fill="#eef1f5"/>
  <ellipse cx="32" cy="33.4" rx="2.5" ry="1.8" fill="#1c2027"/>

  <!-- folder front -->
  <path d="M5.5 38.5h53l-2.6 17a3.5 3.5 0 0 1-3.5 3H11.6a3.5 3.5 0 0 1-3.5-3Z" fill="url(#folder)"/>
  <path d="M5.5 38.5h53" stroke="#ffd18a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- paws gripping the folder edge -->
  <g fill="#3a414c">
    <ellipse cx="21" cy="38.8" rx="5" ry="3.2"/>
    <ellipse cx="43" cy="38.8" rx="5" ry="3.2"/>
  </g>
  <path d="M19 37.2v2.4M21 36.8v2.8M23 37.2v2.4M41 37.2v2.4M43 36.8v2.8M45 37.2v2.4" stroke="#20252d" stroke-width=".9" stroke-linecap="round"/>

  <!-- git branch mark on the folder -->
  <g fill="none" stroke="#1b2029" stroke-width="2.6" stroke-linecap="round">
    <path d="M27 45v9"/>
    <path d="M37.5 46.5c0 4-4.5 4.8-10.5 5.5"/>
  </g>
  <g fill="#1b2029">
    <circle cx="27" cy="45" r="2.6"/>
    <circle cx="27" cy="54" r="2.6"/>
    <circle cx="37.5" cy="46.5" r="2.6"/>
  </g>
</svg>
